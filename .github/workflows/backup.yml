name: Daily backup

on:
  schedule:
    - cron: '0 3 * * *'   # 3am UTC daily — adjust if you want a different time
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab too

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch data and push to backup repo
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_REPO: 'anishaga/prep-backups'
        run: |
          npm install firebase-admin --no-save --silent
          node .github/scripts/backup.js